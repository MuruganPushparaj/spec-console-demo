<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Spec Console</title>
  <link rel="stylesheet" href="/lib/design-system.css">
  <style>
    .projects-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .project-card {
      display: flex;
      flex-direction: column;
      padding: 20px;
      transition: box-shadow 0.15s, border-color 0.15s, transform 0.15s;
      position: relative;
    }
    .project-card:hover {
      border-color: var(--brand);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .project-card-link {
      display: flex;
      flex-direction: column;
      flex: 1;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .project-card-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .project-card:hover .project-card-actions,
    .project-card:focus-within .project-card-actions { opacity: 1; }
    .minibtn {
      border: none;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
      border: 1px solid var(--border);
    }
    .minibtn:hover { color: var(--text); background: var(--surface-2); }
    .minibtn.del:hover { color: var(--red); border-color: #fecaca; background: #fef2f2; }
    .confirmdel {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
      color: var(--red);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 6px;
    }
    .confirmdel button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 5px;
      padding: 1px 6px;
      cursor: pointer;
      font-size: 11px;
    }
    .confirmdel .yes { border-color: var(--red); color: var(--red); }
    .project-card h3 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .project-card p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .project-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .project-meta { font-size: 12px; color: var(--text-muted); }
    .new-project-card {
      border-style: dashed;
      background: transparent;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .new-project-card:hover { color: var(--brand); border-color: var(--brand); background: var(--brand-soft); }
    .new-project-card .plus { font-size: 28px; line-height: 1; margin-bottom: 8px; opacity: 0.6; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(17, 24, 39, 0.4);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 150;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border-radius: var(--radius-lg);
      width: 100%; max-width: 440px; padding: 24px; box-shadow: var(--shadow-md);
    }
    .modal h2 { margin: 0 0 6px; font-size: 18px; }
    .modal p { margin: 0 0 16px; color: var(--text-secondary); font-size: 13px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .org-name { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <main class="sc-page">
    <div class="org-name" id="orgName"></div>
    <div class="projects-toolbar">
      <div>
        <h1 class="sc-page-title">Projects</h1>
        <p class="sc-page-sub" style="margin:0">Select a project to work on forms and status validation.</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="sc-btn sc-btn-secondary" href="/demo/load.html">Try demo</a>
        <button class="sc-btn sc-btn-primary" id="newProjectBtn" type="button">New project</button>
      </div>
    </div>
    <div class="projects-grid" id="projectsGrid"></div>
  </main>

  <div class="modal-backdrop" id="newProjectModal">
    <div class="modal">
      <h2 id="projectModalTitle">Create project</h2>
      <p id="projectModalDesc">Projects group your form specs and status machines. Team members are assigned per project.</p>
      <div class="field">
        <label for="projectName">Project name</label>
        <input class="sc-input" id="projectName" placeholder="e.g. Patient intake" autofocus>
      </div>
      <div class="field">
        <label for="projectDesc">Description (optional)</label>
        <input class="sc-input" id="projectDesc" placeholder="What this project covers">
      </div>
      <div class="modal-actions">
        <button class="sc-btn sc-btn-secondary" id="cancelProject" type="button">Cancel</button>
        <button class="sc-btn sc-btn-primary" id="createProject" type="button">Create project</button>
      </div>
    </div>
  </div>

  <script src="/lib/runtime-config.js"></script>
  <script src="/lib/org.js"></script>
  <script src="/lib/demo-bootstrap.js"></script>
  <script src="/lib/auth.js"></script>
  <script src="/lib/shell.js"></script>
  <script>
    (async () => {
    if (!(await Auth.guardPage())) return;
    const cfg = window.SPEC_CONSOLE_CONFIG || {};
    if (cfg.demoMode && cfg.autoSeedDemo && window.DemoBootstrap) {
      await DemoBootstrap.autoSeedIfNeeded();
    }
    Shell.mount("app-header", { page: "projects" });

    const params = new URLSearchParams(location.search);
    if (params.get("error") === "no-access") Shell.toast("You don't have access to that project");

    let editingProjectId = null;
    let pendingDeleteId = null;

    function render() {
      const org = Org.loadOrg();
      document.getElementById("orgName").textContent = org.name;
      const projects = Org.getAccessibleProjects(org);
      const grid = document.getElementById("projectsGrid");

      if (!projects.length) {
        grid.innerHTML = `<div class="sc-card sc-empty" style="grid-column:1/-1">
          <div class="sc-empty-icon">📁</div>
          <h3 style="margin:0 0 8px;color:var(--text)">No projects yet</h3>
          <p style="margin:0 0 16px">Create your first project to start specifying forms and status flows.</p>
          <button class="sc-btn sc-btn-primary" type="button" id="emptyCreateBtn">Create project</button>
        </div>`;
        document.getElementById("emptyCreateBtn").onclick = () => openModal();
        return;
      }

      grid.innerHTML = projects.map((p) => {
        const access = Org.getProjectAccess(p.id, org);
        const isOwner = Org.isProjectOwner(p.id, org.currentUserId, org);
        const memberCount = p.members.length;
        const isDel = pendingDeleteId === p.id;
        const actions = !isOwner ? "" : isDel
          ? `<div class="project-card-actions"><span class="confirmdel">Delete?<button class="yes" data-confirmdel="${p.id}">yes</button><button data-canceldel>no</button></span></div>`
          : `<div class="project-card-actions"><button class="minibtn" data-editproject="${p.id}" title="Edit project">✎</button><button class="minibtn del" data-askdel="${p.id}" title="Delete project">🗑</button></div>`;
        return `<div class="sc-card project-card">
          ${actions}
          <a class="project-card-link" href="/project.html?p=${encodeURIComponent(p.id)}">
            <h3>${Shell.esc(p.name)}</h3>
            <p>${Shell.esc(p.description || "No description")}</p>
            <div class="project-card-footer">
              <span class="project-meta">${memberCount} member${memberCount !== 1 ? "s" : ""}</span>
              <span class="sc-badge ${access === "write" ? "sc-badge-write" : "sc-badge-read"}">${Org.accessLabel(access, isOwner)}</span>
            </div>
          </a>
        </div>`;
      }).join("") + `<button class="sc-card project-card new-project-card" id="newProjectCard" type="button">
        <div class="plus">+</div>
        <strong>New project</strong>
      </button>`;

      document.getElementById("newProjectCard").onclick = () => openModal();
      grid.querySelectorAll("[data-editproject]").forEach((btn) => {
        btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); openModal(btn.dataset.editproject); };
      });
      grid.querySelectorAll("[data-askdel]").forEach((btn) => {
        btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); pendingDeleteId = btn.dataset.askdel; render(); };
      });
      grid.querySelectorAll("[data-confirmdel]").forEach((btn) => {
        btn.onclick = (e) => {
          e.preventDefault(); e.stopPropagation();
          const result = Org.deleteProject(btn.dataset.confirmdel);
          if (!result.ok) return Shell.toast(result.error);
          pendingDeleteId = null;
          Shell.toast("Project deleted");
          render();
        };
      });
      grid.querySelectorAll("[data-canceldel]").forEach((btn) => {
        btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); pendingDeleteId = null; render(); };
      });
    }

    function openModal(projectId) {
      editingProjectId = projectId || null;
      const modal = document.getElementById("newProjectModal");
      const title = document.getElementById("projectModalTitle");
      const desc = document.getElementById("projectModalDesc");
      const submit = document.getElementById("createProject");
      const nameInput = document.getElementById("projectName");
      const descInput = document.getElementById("projectDesc");

      if (editingProjectId) {
        const project = Org.getProject(editingProjectId);
        title.textContent = "Edit project";
        desc.textContent = "Update the project name and description.";
        submit.textContent = "Save changes";
        nameInput.value = project?.name || "";
        descInput.value = project?.description || "";
      } else {
        title.textContent = "Create project";
        desc.textContent = "Projects group your form specs and status machines. Team members are assigned per project.";
        submit.textContent = "Create project";
        nameInput.value = "";
        descInput.value = "";
      }

      modal.classList.add("open");
      nameInput.focus();
    }

    function closeModal() {
      document.getElementById("newProjectModal").classList.remove("open");
      document.getElementById("projectName").value = "";
      document.getElementById("projectDesc").value = "";
      editingProjectId = null;
    }

    document.getElementById("newProjectBtn").onclick = () => openModal();
    document.getElementById("cancelProject").onclick = closeModal;
    document.getElementById("newProjectModal").onclick = (e) => { if (e.target.id === "newProjectModal") closeModal(); };

    document.getElementById("createProject").onclick = () => {
      const name = document.getElementById("projectName").value.trim();
      if (!name) return Shell.toast("Enter a project name");
      const desc = document.getElementById("projectDesc").value.trim();

      if (editingProjectId) {
        const result = Org.updateProject(editingProjectId, { name, description: desc });
        if (!result.ok) return Shell.toast(result.error);
        closeModal();
        Shell.toast("Project updated");
        render();
        return;
      }

      const id = Org.createProject(name, desc);
      closeModal();
      window.location.href = `/project.html?p=${encodeURIComponent(id)}`;
    };

    document.getElementById("projectName").onkeydown = (e) => {
      if (e.key === "Enter") document.getElementById("createProject").click();
      if (e.key === "Escape") closeModal();
    };

    render();
    })();
  </script>
</body>
</html>
